.relic { position:relative; flex:none; display:flex; align-items:center; justify-content:center; }
.relic--32 { width:32px; height:32px; } .relic--48 { width:48px; height:48px; } .relic--64 { width:64px; height:64px; }

/* ---- battle mock ---- */
.mock { position:relative; --bev-light:var(--iron-500); --bev-dark:var(--iron-900); background:var(--grain),linear-gradient(180deg,var(--iron-700),var(--iron-800)); padding:8px; box-shadow:inset 4px 4px 0 var(--bev-light),inset -4px -4px 0 var(--bev-dark); }
.mock__top { display:flex; justify-content:space-between; align-items:center; padding:4px 8px 12px; }
.mock__scene { position:relative; }
.tray { position:relative; margin-top:8px; padding:16px 24px 8px; display:flex; align-items:flex-end; justify-content:center; gap:32px; height:248px; }
.hand { display:flex; gap:16px; align-items:flex-end; }
.pile { position:relative; width:96px; height:128px; flex:none; margin-bottom:24px; }
.pile__back { position:absolute; inset:0; padding:6px; text-align:center; }
.pile__back img { display:block; margin:24px auto 8px; width:32px; height:32px; }
.pile .t-num { position:absolute; left:0; right:0; bottom:14px; text-align:center; color:var(--stone-100); text-shadow:0 2px 0 var(--stone-950); }
.pile .t-label { position:absolute; left:0; right:0; bottom:-20px; text-align:center; color:var(--stone-300); }
.pile--stack { box-shadow:4px 4px 0 var(--stone-950),8px 8px 0 var(--iron-700),8px 8px 0 1px var(--stone-950); }

/* ---- mock shell (1366x900) ---- */
html { background:#050403; }
body { width:1366px; height:900px; margin:0 auto; padding:0; overflow:hidden; background:#000; position:relative; }
#game { position:absolute; inset:0; width:1366px; height:900px; overflow:hidden; background:var(--stone-950); }
.topbar { position:absolute; left:0; top:0; width:1366px; height:56px; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:0 16px; --bev-light:var(--iron-500); --bev-dark:var(--iron-900);
  background:var(--grain),linear-gradient(180deg,var(--iron-700),var(--iron-800)); box-shadow:inset 0 2px 0 var(--iron-500),inset 0 -4px 0 var(--iron-900),0 4px 0 rgba(0,0,0,.6); }
.topbar .grp { display:flex; align-items:center; gap:12px; }
.topbar .plaque--iron { height:32px; line-height:32px; }
#field { position:absolute; left:0; top:56px; width:1366px; height:612px; overflow:hidden; background:#1a1420; }
#field canvas { image-rendering:pixelated; display:block; }
#scene { position:absolute; left:0; top:0; width:1370px; height:615px; }
#fx { position:absolute; left:0; top:0; width:1370px; height:615px; z-index:80; pointer-events:none; }
#amb { position:absolute; left:0; top:0; width:1370px; height:615px; z-index:79; pointer-events:none; image-rendering:pixelated; }
#flash, #dim, #tint, #firelight { position:absolute; inset:0; pointer-events:none; opacity:0; }
#flash { z-index:85; background:#e8f2ff; }
#dim { z-index:84; background:linear-gradient(180deg,rgba(6,10,36,.62),rgba(6,10,36,.28)); }
#tint { z-index:83; left:520px; background:repeating-linear-gradient(0deg,rgba(90,150,220,.26) 0 4px,rgba(60,120,200,.18) 4px 8px); -webkit-mask-image:linear-gradient(90deg,transparent 0 20px,rgba(0,0,0,.35) 20px 40px,rgba(0,0,0,.7) 40px 60px,#000 60px); mask-image:linear-gradient(90deg,transparent 0 20px,rgba(0,0,0,.35) 20px 40px,rgba(0,0,0,.7) 40px 60px,#000 60px); }
#firelight { z-index:84; background:#ff9a3c; mix-blend-mode:soft-light; }
.tray { position:absolute; left:0; top:668px; width:1366px; height:232px; margin:0; padding:0; display:block; z-index:30; box-shadow:inset 4px 4px 0 var(--wood-600),inset -4px -4px 0 var(--wood-900),inset 0 6px 0 var(--gold-900),0 -4px 0 rgba(0,0,0,.6); }
.tray .hand { position:absolute; left:283px; top:12px; width:800px; display:flex; gap:16px; align-items:flex-end; }
.tray .hand .card { cursor:pointer; }
.tray .left, .tray .right { position:absolute; top:0; height:232px; display:flex; align-items:center; gap:20px; }
.tray .left { left:72px; } .tray .right { right:56px; }
.pilebtn { position:relative; width:72px; height:96px; cursor:pointer; }
.pilebtn .pb { position:absolute; inset:0 0 16px 0; display:flex; align-items:center; justify-content:center; background:var(--grain),linear-gradient(180deg,var(--iron-700),var(--iron-800)); box-shadow:inset 4px 4px 0 var(--iron-500),inset -4px -4px 0 var(--iron-900),3px 3px 0 var(--stone-950),6px 6px 0 var(--iron-700),6px 6px 0 1px var(--stone-950); }
.pilebtn.disc .pb { box-shadow:inset 4px 4px 0 var(--iron-500),inset -4px -4px 0 var(--iron-900),4px 4px 0 var(--stone-950); }
.pilebtn .t-label { position:absolute; left:0; right:0; bottom:-6px; text-align:center; color:var(--stone-300); }
.pilebtn:hover .pb { box-shadow:inset 4px 4px 0 var(--gold-400),inset -4px -4px 0 var(--iron-900),4px 4px 0 var(--stone-950); }
.endturn { width:150px; }
.endturn .btn { width:150px; height:56px; padding:16px 0; text-align:center; }

/* ---- units ---- */
.spr { animation:idle 1s steps(1,end) infinite; }
.mv { position:relative; display:block; }
.flip { transform:scaleX(-1); }
.hit { animation:hit 264ms steps(4,end); }
@keyframes hit { 0% { transform:translateX(0); filter:brightness(3.2) contrast(.8); } 25% { transform:translateX(-6px); filter:brightness(1.6); } 50% { transform:translateX(6px); filter:none; } 75% { transform:translateX(-4px); } 100% { transform:translateX(0); } }
.cast { animation:cast 420ms steps(3,end); }
@keyframes cast { 0% { transform:translateY(0); } 33% { transform:translateY(-12px); } 66% { transform:translateY(-12px); } 100% { transform:translateY(0); } }
.charge { animation:charge var(--dur,900ms) steps(1,end) forwards; }
@keyframes charge {
  0%   { transform:translateX(0); }
  10%  { transform:translateX(calc(var(--dir) * -12px)); }
  18%  { transform:translateX(calc(var(--dir) * var(--dx) * .25)); }
  26%  { transform:translateX(calc(var(--dir) * var(--dx) * .5)); }
  34%  { transform:translateX(calc(var(--dir) * var(--dx) * .75)); }
  42%  { transform:translateX(calc(var(--dir) * var(--dx))); }
  62%  { transform:translateX(calc(var(--dir) * var(--dx))); }
  70%  { transform:translateX(calc(var(--dir) * var(--dx) * .66)); }
  78%  { transform:translateX(calc(var(--dir) * var(--dx) * .33)); }
  86%  { transform:translateX(0); }
  100% { transform:translateX(0); }
}
.glow .mv { animation:glow 528ms steps(1,end) 2; }
@keyframes glow { 0% { filter:brightness(1.25) saturate(1.1); } 50% { filter:brightness(1.1); } 100% { filter:none; } }
.floater { position:absolute; z-index:90; font:400 24px/24px var(--font-pixel); color:var(--blood-300); text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000; animation:float 990ms steps(9,end) forwards; white-space:nowrap; }
.floater.good { color:var(--moss-300); } .floater.gold { color:var(--gold-200); } .floater.ice { color:var(--frost-200); }
@keyframes float { from { transform:translateY(0); opacity:1; } 75% { opacity:1; } to { transform:translateY(-40px); opacity:0; } }

/* frozen: persistent ice block over the sprite */
.frozen .spr { filter:saturate(.45) brightness(1.12) hue-rotate(-10deg); animation-play-state:paused; }
.ice { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:3; image-rendering:pixelated; background-size:100% 100%; }
.ice.grow { animation:icegrow 400ms steps(6,end) forwards; }
@keyframes icegrow { from { clip-path:inset(100% 0 0 0); } to { clip-path:inset(0 0 0 0); } }
.chip { display:inline-flex; align-items:center; gap:2px; height:20px; padding:0 4px 0 2px; background:var(--stone-950); box-shadow:inset 0 0 0 2px var(--iron-600); color:var(--stone-100); font:400 8px/20px var(--font-pixel); }
.chip img { width:16px; height:16px; }
.chip.cold { box-shadow:inset 0 0 0 2px var(--steel-500); color:var(--frost-200); }
.chip.bad { box-shadow:inset 0 0 0 2px var(--blood-700); color:var(--blood-300); }
.chip.good { box-shadow:inset 0 0 0 2px var(--gold-700); color:var(--gold-200); }
.count { display:inline-block; height:24px; padding:0 6px; background:var(--stone-950); box-shadow:inset 0 0 0 2px var(--gold-700); font:400 16px/24px var(--font-pixel); color:var(--stone-100); white-space:nowrap; text-shadow:0 2px 0 #000; }
.enemy .count { box-shadow:inset 0 0 0 2px var(--steel-500); }

/* hero busts on their rampart */
.hero { position:absolute; z-index:20; width:192px; height:192px; }
.hero .spr { display:block; }
.rampart { position:absolute; z-index:22; pointer-events:none; }
.herotag { position:absolute; z-index:24; height:24px; padding:0 10px; font:400 8px/24px var(--font-pixel); letter-spacing:1px; text-transform:uppercase; color:var(--stone-100); background:var(--stone-950); box-shadow:inset 0 0 0 2px var(--iron-600); white-space:nowrap; text-align:center; }
.herotag.p { box-shadow:inset 0 0 0 2px var(--gold-700); } .herotag.e { box-shadow:inset 0 0 0 2px var(--steel-500); color:var(--frost-200); }
.torch { position:absolute; z-index:26; image-rendering:pixelated; background-repeat:no-repeat; animation:idle 400ms steps(1,end) infinite; }
.torchglow { position:absolute; z-index:5; pointer-events:none; }

/* dev panel */
.dev { position:absolute; right:10px; top:62px; z-index:100; width:214px; padding:6px; background:rgba(8,7,6,.86); box-shadow:inset 0 0 0 2px var(--stone-600); }
.dev h6 { font:400 8px/12px var(--font-pixel); color:var(--stone-300); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
.dev .g { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.dev button { font:400 8px/12px var(--font-pixel); text-transform:uppercase; letter-spacing:.5px; padding:5px 4px; border:0; cursor:pointer; color:var(--stone-100); background:var(--iron-700); box-shadow:inset 2px 2px 0 var(--iron-500),inset -2px -2px 0 var(--iron-900); }
.dev button:hover { background:var(--iron-600); color:var(--gold-200); }
.dev button.wide { grid-column:1 / 3; }

@media (prefers-reduced-motion: reduce) {
  .spr, .torch { animation:none !important; }
  .cast, .charge, .glow .mv, .hit { animation:none !important; }
  .ice.grow { animation:none !important; }
  .floater { animation-duration:1ms !important; }
}

/* ---- OPTION B: units stand on the ground, no rectangles ---- */
#layer { position:absolute; inset:0; }
.u { position:absolute; pointer-events:none; }
.u .shadow, .u .ring, .mk { position:absolute; image-rendering:pixelated; pointer-events:none; }
.u .mv { position:absolute; left:0; top:0; }
.u .hb { position:absolute; pointer-events:auto; cursor:pointer; z-index:5; }
.u .ring { display:none; }
.u.hover .ring, .u.sel .ring { display:block; }
.u .tag { display:none; position:absolute; z-index:6; transform:translateX(-50%); height:24px; padding:0 10px; font:400 8px/24px var(--font-pixel); letter-spacing:1px; text-transform:uppercase; color:var(--stone-100); background:var(--stone-950); box-shadow:inset 0 0 0 2px var(--gold-700); white-space:nowrap; }
.u.enemy .tag { box-shadow:inset 0 0 0 2px var(--blood-500); }
.u .tag::after { content:''; position:absolute; left:50%; bottom:-4px; margin-left:-4px; width:8px; height:4px; background:var(--stone-950); }
.u.hover .tag, .u.sel .tag { display:block; }
.u.acted .mv { filter:saturate(.3) brightness(.62); }
.u.acted .spr { animation-play-state:paused; }
.info { position:absolute; display:flex; gap:4px; align-items:center; z-index:70; pointer-events:none; }
.info.e { flex-direction:row-reverse; transform:translateX(-100%); }
.info .chips { display:flex; gap:4px; }
.info.e .chips { flex-direction:row-reverse; }
.mk { display:none; z-index:1; animation:blink 800ms steps(1,end) infinite; }
@keyframes blink { 0% { opacity:1; } 50% { opacity:.45; } }
#field[data-mark="ally"] .mk.p, #field[data-mark="foe"] .mk.e { display:block; }
.grave { position:absolute; image-rendering:pixelated; pointer-events:none; }
@media (prefers-reduced-motion: reduce) { .mk { animation:none !important; } }

</style>
</head>

/* ================= unit state helpers ================= */
function replay(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms || 900); }
function floatAt(x, y, txt, cls) { const f = h('div', 'floater ' + (cls || ''), txt); f.style.left = (x - 20) + 'px'; f.style.top = (y - 20) + 'px'; $('#field').appendChild(f); setTimeout(() => f.remove(), 1100); }
function P(id) { const u = UNITS[id]; const b = u.box; return { x: b.cx, top: b.top, feet: b.feet, head: b.top + 3 * u.scale, mid: (b.top + 3 * u.scale + b.feet) / 2, s: u.scale }; }
function hitUnit(id, txt, cls) { const u = UNITS[id]; if (!u) return; replay(u.mv, 'hit', 300); const p = P(id); if (txt) floatAt(p.x, p.head, txt, cls); }
function addChip(id, c) { const u = UNITS[id]; if (!u.chipsEl || u.chipsEl.querySelector('[data-chip="' + c.icon + '"]')) return; u.chipsEl.appendChild(chipEl(c)); }
function removeChip(id, icon) { const u = UNITS[id]; const e = u.chipsEl && u.chipsEl.querySelector('[data-chip="' + icon + '"]'); if (e) e.remove(); }
function freezeUnit(id, animate) {
  const u = UNITS[id]; if (!u || u.frozen) return; u.frozen = true; u.root.classList.add('frozen');
  const ice = h('div', 'ice' + (animate && !RM ? ' grow' : '')); ice.style.backgroundImage = 'url(' + iceURL() + ')'; u.mv.appendChild(ice);
  addChip(id, { icon: 'freeze', text: '1', cls: 'cold' });
  if (window.onFreeze) window.onFreeze(id, true);
}
function thawUnit(id) {
  const u = UNITS[id]; if (!u || !u.frozen) return; u.frozen = false; u.root.classList.remove('frozen');
  const ice = u.mv.querySelector('.ice'); if (ice) ice.remove(); removeChip(id, 'freeze');
  if (window.onFreeze) window.onFreeze(id, false);
}
function resetField() { if (cur) finish(); Object.keys(UNITS).forEach(thawUnit); $('#field').querySelectorAll('.floater').forEach((f) => f.remove()); }
const foes = () => Object.values(UNITS).filter((u) => u.team === 'enemy');

/* ================= fx canvas (5px cells, same grid as sprites) ================= */
let fctx = null;
function fxInit() { const cv = $('#fx'); cv.width = CW; cv.height = CH; fctx = cv.getContext('2d'); }
function fxClear() { fctx.clearRect(0, 0, CW, CH); }
function dot(x, y, c, w = 1, hh = 1) { fctx.fillStyle = c; fctx.fillRect(Math.floor(x), Math.floor(y), w, hh); }
function disc(cx, cy, r, c) { fctx.fillStyle = c; for (let j = -r; j <= r; j++) { const hw = Math.floor(Math.sqrt(r * r - j * j + 0.6)); fctx.fillRect(Math.floor(cx) - hw, Math.floor(cy) + j, hw * 2 + 1, 1); } }
function blob(cx, cy, r, c, seed) { fctx.fillStyle = c; const R = Math.ceil(r * 1.4); for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) { const d = Math.sqrt(i * i + j * j), th = Math.atan2(j, i); const rr = r * (1 + 0.2 * Math.sin(3 * th + seed) + 0.13 * Math.sin(7 * th + seed * 2.3) + (j < 0 ? 0.12 : -0.05)); if (d <= rr) fctx.fillRect(Math.floor(cx) + i, Math.floor(cy) + j, 1, 1); } }
function ringc(cx, cy, r, th, c) { fctx.fillStyle = c; for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const d = Math.sqrt(i * i + j * j); if (d <= r + 0.3 && d > r - th + 0.3) fctx.fillRect(Math.floor(cx) + i, Math.floor(cy) + j, 1, 1); } }
function ellc(cx, cy, rx, ry, c, ringOnly) { fctx.fillStyle = c; for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) { const d = (i * i) / (rx * rx) + (j * j) / (ry * ry); if (ringOnly ? (d <= 1.05 && d > 0.62) : d <= 1) fctx.fillRect(Math.floor(cx) + i, Math.floor(cy) + j, 1, 1); } }
function line(x0, y0, x1, y1, c, t = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; fctx.fillStyle = c; const o = Math.floor(t / 2);
  for (let n = 0; n < 4000; n++) { fctx.fillRect(x0 - o, y0 - o, t, t); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function boltPath(x0, y0, x1, y1, seed, rough) {
  const r = rng(seed); let pts = [[x0, y0], [x1, y1]];
  for (let it = 0; it < 5; it++) {
    const n = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1]; const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const off = (r() - 0.5) * len * (rough || 0.5); const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
      n.push(a, [(a[0] + b[0]) / 2 + nx * off, (a[1] + b[1]) / 2 + ny * off]);
    }
    n.push(pts[pts.length - 1]); pts = n;
  }
  return pts;
}
function strokePath(pts, layers) { layers.forEach(([t, c]) => { for (let i = 0; i < pts.length - 1; i++) line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], c, t); }); }
function ov(id, a) { const e = document.getElementById(id); if (e) e.style.opacity = RM && id === 'flash' ? 0 : a; }
function shake(dx, dy) { if (RM) return; $('#game').style.transform = (dx || dy) ? 'translate(' + dx + 'px,' + dy + 'px)' : ''; }
const q = (v, n) => Math.round(v * n) / n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cx5 = (v) => v / CELL;

/* ================= spell runner ================= */
const FR = 66;
let cur = null;
function runSpell(name) {
  if (name === 'freezeToggle') { const any = foes().some((u) => u.frozen); if (any) foes().forEach((u) => thawUnit(u.id)); else ['orc', 'wolf'].forEach((id) => freezeUnit(id, false)); return; }
  if (cur) finish();
  const sp = SPELLS[name]; const ctx = sp.init(); cur = { sp, ctx, t0: performance.now(), fired: 0, paused: null, last: -1, events: sp.events(ctx).sort((a, b) => a.at - b.at) };
  if (RM) { step(sp.peak, true); cur.fired = cur.events.length; cur.events.forEach((e) => e.fn()); setTimeout(() => { if (cur && cur.ctx === ctx) finish(); }, 900); return; }
  requestAnimationFrame(loop);
}
function step(t, force) {
  const tq = Math.floor(t / FR) * FR; if (tq === cur.last && !force) return; cur.last = tq;
  while (cur.fired < cur.events.length && cur.events[cur.fired].at <= tq) cur.events[cur.fired++].fn();
  fxClear(); cur.sp.draw(tq, cur.ctx);
}
function loop(now) { if (!cur || cur.paused != null) return; const t = now - cur.t0; if (t >= cur.sp.dur) { finish(); return; } step(t); requestAnimationFrame(loop); }
function finish() { if (!cur) return; const c = cur; cur = null; while (c.fired < c.events.length) c.events[c.fired++].fn(); fxClear(); ['flash', 'dim', 'tint', 'firelight'].forEach((i) => ov(i, 0)); shake(0, 0); if (c.sp.done) c.sp.done(c.ctx); }
window.__seek = (name, t) => { if (cur) finish(); const sp = SPELLS[name]; const ctx = sp.init(); cur = { sp, ctx, t0: 0, fired: 0, paused: t, last: -1, events: sp.events(ctx).sort((a, b) => a.at - b.at) }; step(t, true); };
window.__end = () => finish();

/* hero anchors */
function heroHand(side) { const b = HEROES[side].box; return { x: b.cx + (side === 'p' ? 42 : -42), y: b.top + 78 }; }
function heroCast(side) { const m = HEROES[side].mv; replay(m, 'cast', 450); }
function castSparks(side, tq, col1, col2, until) {
  if (tq > until) return; const p = heroHand(side); const r = rng(tq + 5);
  for (let i = 0; i < 9; i++) { const a = r() * 6.283, d = 3 + r() * 8; dot(cx5(p.x) + Math.cos(a) * d, cx5(p.y) + Math.sin(a) * d, r() < 0.5 ? col1 : col2, r() < 0.3 ? 2 : 1, r() < 0.3 ? 2 : 1); }
}
function scorch(x, y, rx, ry, alpha) { ellc(cx5(x), cx5(y), rx, ry, alpha ? '#0e0a10' : '#1c141c'); ellc(cx5(x), cx5(y), rx, ry, '#3a2a30', true); }

const SPELLS = {};

/* ---- 1. LIGHTNING ---- */
SPELLS.lightning = {
  dur: 1500, peak: 300,
  init() {
    const tg = foes().sort((a, b) => P(a.id).feet - P(b.id).feet); const r = rng(11); const at = [250, 430, 590, 790];
    return {
      bolts: tg.map((u, i) => {
        const p = P(u.id); const tx = cx5(p.x) + (i % 2 ? 2 : -2), ty = cx5(p.mid + 10); const x0 = tx + (r() - 0.5) * 34;
        const A = boltPath(x0, -2, tx, ty, 100 + i * 7, 0.42), B = boltPath(x0 + (r() - .5) * 4, -2, tx, ty, 300 + i * 13, 0.42);
        const forks = [0.3, 0.5, 0.68].map((f, k) => { const pt = A[Math.floor(A.length * f)]; const dir = (k % 2 ? 1 : -1); return boltPath(pt[0], pt[1], pt[0] + dir * (7 + r() * 8), pt[1] + 8 + r() * 10, 500 + i * 3 + k, 0.5); });
        const sparks = Array.from({ length: 9 }, () => ({ a: -Math.PI + r() * Math.PI * 1.0, v: 2.2 + r() * 3.2 }));
        return { id: u.id, at: at[i % 4], tx, ty, A, B, forks, sparks, feet: cx5(p.feet) };
      }),
    };
  },
  events(c) { const ev = [{ at: 0, fn: () => heroCast('p') }]; c.bolts.forEach((b) => ev.push({ at: b.at, fn: () => hitUnit(b.id, '-9', 'ice') })); return ev; },
  draw(tq, c) {
    ov('dim', q(clamp(tq / 200, 0, 1) * (1 - clamp((tq - 1150) / 300, 0, 1)), 3));
    castSparks('p', tq, '#cfe8ec', '#7fb7c4', 260);
    let fl = 0, sh = 0;
    c.bolts.forEach((b) => { const a = tq - b.at; if (a >= 0 && a < 66) fl = Math.max(fl, 0.34); else if (a >= 66 && a < 132) fl = Math.max(fl, 0.12); if (a >= 0 && a < 200) sh = Math.max(sh, a < 100 ? 7 : 3); });
    ov('flash', fl); const f = Math.floor(tq / FR); shake(sh ? (f % 2 ? sh : -sh) : 0, sh ? (f % 3 ? 3 : -3) : 0);
    c.bolts.forEach((b) => {
      const a = tq - b.at; if (a < 0) return; const k = Math.floor(a / FR);
      if (a >= 66 && tq < 1400) scorch((b.tx) * CELL, b.feet * CELL, 12, 3);
      if (k < 4) {
        const pts = k % 2 ? b.B : b.A;
        if (k < 2) { strokePath(pts, [[5, '#3a5fc8'], [3, '#9fd0ff'], [1, '#ffffff']]); b.forks.forEach((fk) => strokePath(fk, [[3, '#3a5fc8'], [1, '#cfe8ff']])); }
        else if (k === 2) { strokePath(pts, [[3, '#3a5fc8'], [1, '#9fd0ff']]); }
        else { for (let i = 0; i < pts.length - 1; i += 2) line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], '#7fb7ff', 1); }
      }
      if (k === 0) { disc(b.tx, b.ty, 5, '#ffffff'); ringc(b.tx, b.ty, 10, 2, '#9fd0ff'); }
      else if (k === 1) { ringc(b.tx, b.ty, 13, 2, '#9fd0ff'); disc(b.tx, b.ty, 3, '#e6f6ff'); }
      if (k >= 1 && k < 6) b.sparks.forEach((s) => { const t = (a - 66) / 1000; dot(b.tx + Math.cos(s.a) * s.v * t * 22, b.ty + Math.sin(s.a) * s.v * t * 22 + t * t * 40, k < 4 ? '#ffffff' : '#9fd0ff'); });
    });
  },
};

/* ---- 2. FROST RAIN over the whole enemy area ---- */
SPELLS.frost = {
  dur: 2500, peak: 950,
  init() {
    const r = rng(21); const parts = [];
    for (let i = 0; i < 190; i++) {
      const shard = i % 5 < 2; const sp = 420 + r() * 380; const land = 40 + r() * 76;
      parts.push({ x: 112 + r() * 162, t0: 250 + r() * 1000, sp: sp / CELL, shard, len: shard ? 4 + (r() * 5 | 0) : 0, big: !shard && r() < 0.3, land, drift: -0.28 - r() * 0.12 });
    }
    return { parts, order: foes().sort((a, b) => P(a.id).feet - P(b.id).feet).map((u) => u.id) };
  },
  events(c) {
    const ev = [{ at: 0, fn: () => heroCast('p') }];
    c.order.forEach((id, i) => { ev.push({ at: 1350 + i * 130, fn: () => hitUnit(id, '-6', 'ice') }); ev.push({ at: 1460 + i * 130, fn: () => freezeUnit(id, true) }); });
    return ev;
  },
  draw(tq, c) {
    ov('tint', q(clamp(tq / 500, 0, 1) * (1 - clamp((tq - 1800) / 500, 0, 1)), 4));
    castSparks('p', tq, '#cfe8ec', '#ffffff', 300);
    c.parts.forEach((p) => {
      const a = (tq - p.t0) / 1000; if (a < 0) return; const y = -6 + a * p.sp, x = p.x + a * p.sp * p.drift;
      if (y < p.land) {
        if (p.shard) { const dx = -p.drift, L = p.len; line(x - dx * L * 0.6, y - L, x, y, '#7fb7c4', 2); line(x - dx * L * 0.6, y - L, x, y, '#cfe8ec', 1); dot(x, y, '#ffffff', 1, 2); dot(x - 1, y + 1, '#ffffff'); }
        else { dot(x, y, '#ffffff', p.big ? 2 : 1, p.big ? 2 : 1); if (p.big) { dot(x - 1, y, '#cfe8ec'); dot(x + 2, y, '#cfe8ec'); dot(x, y - 1, '#cfe8ec'); dot(x, y + 2, '#cfe8ec'); } }
      } else if (y - p.land < p.sp * 0.14) { const k = Math.floor((y - p.land) / (p.sp * 0.07)); const lx = x, ly = p.land; if (k === 0) { dot(lx - 2, ly, '#ffffff', 5, 1); dot(lx, ly - 2, '#cfe8ec', 1, 5); } else { dot(lx - 3, ly - 1, '#7fb7c4'); dot(lx + 3, ly - 1, '#7fb7c4'); dot(lx, ly - 3, '#cfe8ec'); } }
      else if (p.shard && a * 1000 + p.t0 < 1900) { dot(x, p.land + 1, '#cfe8ec', 2, 1); }
    });
    if (tq >= 1350) c.order.forEach((id, i) => { const a = tq - (1350 + i * 130); if (a < 0 || a > 300) return; const p = P(id); const k = Math.floor(a / FR); ringc(cx5(p.x), cx5(p.mid), 6 + k * 4, 2, '#cfe8ec'); if (k < 2) disc(cx5(p.x), cx5(p.mid), 3, '#ffffff'); });
  },
};

/* ---- 4. FIREBALL ---- */
SPELLS.fireball = {
  dur: 2100, peak: 900,
  init() {
